name: Verify assignment
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU test environment
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Public grading interface
        run: PYTHONPATH=. python -m pytest -q tests/test_public_adapter_smoke.py
      - name: Full offline suite
        run: PYTHONPATH=. python -m pytest -q
      - name: Verify saved submission evidence
        run: python scripts/verify_submission.py
      - name: Recompute original judge results
        run: python scripts/summarize_saved_evaluation.py
